name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opentab
          POSTGRES_PASSWORD: opentab
          POSTGRES_DB: opentab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opentab" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opentab:opentab@localhost:5432/opentab
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bench
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "1"
      # Same suite as deployed on serverless: under a sub-path, polling, inline jobs, no worker.
      - name: Build (sub-path, serverless modes)
        run: pnpm --filter @opentab/web build
        env:
          BASE_PATH: /opentab
          APP_URL: http://localhost:3000/opentab
          LIVE_MODE: poll
          JOB_MODE: inline
      - name: E2E (sub-path, serverless modes)
        run: pnpm e2e
        env:
          BASE_PATH: /opentab
          APP_URL: http://localhost:3000/opentab
          LIVE_MODE: poll
          JOB_MODE: inline
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
